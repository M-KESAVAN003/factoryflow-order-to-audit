services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factoryflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factoryflow_local_only}
      POSTGRES_DB: factoryflow_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryflow -d factoryflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://factoryflow:${POSTGRES_PASSWORD:-factoryflow_local_only}@db:5432/factoryflow_dev?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:-local-docker-only-secret-change-in-production-32chars}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-replace-with-custom-non-default-demo-password}
    ports:
      - "8000:8000"
