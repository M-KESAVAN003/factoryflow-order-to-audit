name: FactoryFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Migrations & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: ci-ephemeral-signing-key-minimum-32-bytes-long
      DEMO_SEED_ENABLED: "false"
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify Alembic migrations
        run: |
          rm -f ci_alembic.db
          DATABASE_URL=sqlite:///./ci_alembic.db alembic upgrade head
          rm -f ci_alembic.db
      - name: Run Pytest suite
        run: pytest -v

  frontend:
    name: Frontend Tests, TypeScript & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Vitest suite
        run: npm test
      - name: TypeScript check and production Vite build
        run: npm run build
